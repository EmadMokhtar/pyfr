# The PyFr repository's own tooling, not a distributable package.
#
# PyFr v1 is a cookiecutter template (see docs/explanation/why-a-template.md):
# nothing here is published to a package index, and a generated service
# imports no PyFr package. This file exists so `uv` has a project to sync —
# today that is the documentation toolchain; M7 adds the template's own test
# suite (cookiecutter, pytest-cookies) to a `dev` group beside it.
#
# The reference service has its own, entirely separate `pyproject.toml` under
# examples/reference-service/. The two are never synced together.
[project]
name = "pyfr"
version = "0.5.0"
description = "PyFr — a cookiecutter template for production-ready Python microservices"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

[tool.uv]
# No build-system section below, so uv already treats this as a virtual
# project. Stated explicitly so the intent survives someone later adding
# dependencies here and wondering why nothing installs `pyfr` itself.
package = false

[tool.commitizen]
name = "cz_conventional_commits"
# Writes BOTH pyproject.toml's [project].version and uv.lock's matching
# [[package]] entry. `pep621` writes only the first, which leaves the lock
# file stale and fails the uv-lock hook -- inside the release workflow,
# after the tag has already been pushed.
version_provider = "uv"
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
# Pre-1.0: a breaking change bumps the MINOR number (0.5.0 -> 0.6.0)
# rather than jumping to 1.0.0. Semver puts no compatibility promise on
# the major number below 1.0.0, and 1.0.0 should be a deliberate decision
# about stability, not a side effect of the first `feat!:`.
major_version_zero = true

[dependency-groups]
docs = [
    # Capped below 2.0: MkDocs 2.0 removes the plugin system entirely, with
    # no migration path, which would break mkdocs-material and the docs
    # build outright.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
# The repository's own scripts have tests. The service's suite is entirely
# separate and lives under examples/reference-service/.
dev = [
    # Pinned exactly, and pinned HERE only: the version that decides what
    # each release is numbered must be one version, in one file that
    # Dependabot updates. .pre-commit-config.yaml's commit-message hook,
    # the root justfile and release.yml all run it through
    # `uv run --locked --group dev cz` (ADR 0014).
    "commitizen==4.18.0",
    "pytest>=8.3",
    # tests/test_check_docs_freshness.py imports scripts/check_docs_freshness.py,
    # which does `import yaml` directly. Declared here rather than left to
    # arrive transitively through the `docs` group's MkDocs: `dev` must be
    # installable, and testable, on its own, without a `docs` sync alongside
    # it. Floor matches what uv.lock already resolves.
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
