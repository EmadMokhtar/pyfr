# The PyFr repository's own project: the documentation toolchain, the
# template's test suite, and -- since M8 -- the `pyfr-cli` package.
#
# PyFr v1 is a cookiecutter template (see docs/explanation/why-a-template.md).
# A generated service imports no PyFr package and has no runtime
# dependency on this repository (spec D1). What IS published, to PyPI, is
# `pyfr-cli`: the development-time tool a generated project runs through
# `uvx` to pull in a newer template version (M8 spec, section 3). It is
# built from src/pyfr_cli/ only; hooks/, scripts/, tests/ and the template
# body never enter the wheel.
#
# The reference service has its own, entirely separate `pyproject.toml` under
# examples/reference-service/. The two are never synced together.
[project]
name = "pyfr-cli"
version = "0.11.0"
description = "PyFr — a cookiecutter template for production-ready Python microservices, and the tool that keeps a generated project up to date with it"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    # Renders the template at the target version inside `pyfr update`;
    # the same range the template's own tests render with.
    "cookiecutter>=2.6,<3",
    # .pyfr-answers.yml, the one file an update reads and rewrites.
    "pyyaml>=6.0",
    # .pyfr-update-ignore uses gitignore syntax; pathspec is the
    # pure-Python implementation of gitignore matching.
    "pathspec>=0.12",
]

[project.scripts]
pyfr = "pyfr_cli.__main__:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyfr_cli"]

[tool.hatch.build.targets.sdist]
# The sdist is the wheel's source and nothing else: not the template body,
# not the example, not the tests.
only-include = ["src/pyfr_cli", "README.md", "LICENSE"]

[tool.uv]
# Never resolve to a pre-release unless a requirement names one; the same
# rule as the template's pyproject.toml, for the same reason (PR #32). No
# requirement here names one, so this lock holds no pre-releases at all.
prerelease = "explicit"

[tool.mypy]
# The published tool is type-checked strictly; nothing else at the root is
# (hooks/ and scripts/ are checked by their tests). `just typecheck`.
strict = true
python_version = "3.13"
files = ["src/pyfr_cli"]

[[tool.mypy.overrides]]
# cookiecutter ships no type information.
module = ["cookiecutter.*"]
ignore_missing_imports = true

[tool.commitizen]
name = "cz_conventional_commits"
# Writes BOTH pyproject.toml's [project].version and uv.lock's matching
# [[package]] entry. `pep621` writes only the first, which leaves the lock
# file stale and fails the uv-lock hook -- inside the release workflow,
# after the tag has already been pushed.
version_provider = "uv"
# The template version every generated project records in its
# .pyfr-answers.yml, moved by the same bump: cookiecutter.json's
# `_template_version` is the version on disk here, always
# (tests/test_generation.py holds the two equal), and a render copies it.
# Commitizen replaces the CURRENT version on the line the pattern names,
# and release.yml passes `--check-consistency` so a bump that cannot find
# it there fails instead of leaving the template version behind.
version_files = ["cookiecutter.json:_template_version"]
# Runs after `cz bump` has written the new version into pyproject.toml,
# uv.lock and cookiecutter.json, and before its commit -- the one slot
# between the two, since `cz bump` writes and commits in a single command.
# The regeneration rewrites the example's .pyfr-answers.yml with the
# version being released and carries the contract baseline release.yml
# promotes in the template body into the example; `cz bump` commits with
# `git commit -a`, so both ride in the bump commit (spec section 4.4). A
# dry run (`just next-version`) stops before any file is written and never
# reaches this. Needs `just` on PATH, which release.yml installs.
pre_bump_hooks = ["just regen"]
tag_format = "v$version"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
# Pre-1.0: a breaking change bumps the MINOR number (0.5.0 -> 0.6.0)
# rather than jumping to 1.0.0. Semver puts no compatibility promise on
# the major number below 1.0.0, and 1.0.0 should be a deliberate decision
# about stability, not a side effect of the first `feat!:`.
major_version_zero = true

[dependency-groups]
docs = [
    # Capped below 2.0: MkDocs 2.0 removes the plugin system entirely, with
    # no migration path, which would break mkdocs-material and the docs
    # build outright.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]
# The repository's own scripts have tests. The service's suite is entirely
# separate and lives under examples/reference-service/.
dev = [
    # Pinned exactly, and pinned HERE only: the version that decides what
    # each release is numbered must be one version, in one file that
    # Dependabot updates. .pre-commit-config.yaml's commit-message hook,
    # the root justfile and release.yml all run it through
    # `uv run --locked --group dev cz` (ADR 0014).
    "commitizen==4.18.0",
    "pytest>=8.3",
    "pytest-cookies>=0.7",
    # The repository's git hooks (.pre-commit-config.yaml at the root). Until
    # M7 the reference service's configuration doubled as the repository's;
    # now the service's is written for a generated project and cannot run
    # nested inside this repository (Verified Fact 1 of the M7 PR 1 plan).
    "pre-commit>=4.0",
    # `just typecheck`: mypy --strict over src/pyfr_cli. types-pyyaml is
    # the stub package for pyyaml, which ships no type information.
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    # The root has Python of its own -- hooks/, scripts/, tests/ -- and its
    # hooks must not depend on the example's environment, which does not
    # exist between the move and the first regeneration. A second ruff pin,
    # in a second lock, for a second project: the exception ADR 0014 lists.
    "ruff>=0.7",
    # scripts/regen.py renders template paths with it directly (adopt)
    "jinja2>=3.1",
]

[tool.pytest.ini_options]
# `-m "not full_suite"` keeps the full-suite tests out of every ordinary
# run: `just test`, CI's `docs` job, a bare `pytest`. A `-m` given on the
# command line replaces this one (the last `-m` wins), so
# `pytest -m full_suite` runs exactly those -- that is what
# `just test-full-suite` and .github/workflows/full-suite.yml do.
addopts = "-q --strict-markers --strict-config -m \"not full_suite\""
markers = [
    "full_suite: renders a project for real -- the hook runs `uv sync` and `git init` -- and runs its own `just check-all`; slow, needs Docker and the network (spec section 10.3)",
]
testpaths = ["tests"]
