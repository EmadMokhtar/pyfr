# The ONLY way a finding is exempted from `just scan` (ADR 0016). Every
# entry names why, is pinned to the path it applies to, and EXPIRES: after
# `expired_at`, the finding fails the scan again until someone re-decides.
# Renewing an entry means re-checking whether a fix has shipped -- that is
# what the date is for. `trivy image --show-suppressed` lists what this
# file is currently hiding.
#
# All eight below are vendored inside the migrate/migrate Go binary. The
# newest release (v4.20.1, 2026-09-09) still carries them, so no image bump
# can clear them today (M6 plan, Verified Fact 6). Dockerfile.migrations
# rebuilds that release from source with a patched Go toolchain, which
# cleared the standard-library findings; the dependencies stay at the
# versions the release pins. None is reachable from `migrate up` against
# PostgreSQL: the ssh client, the gRPC xDS server paths, the unicode
# normaliser, the PRECIS Nickname profile and HTTP/2 peers are not on that
# code path, and the s2 package of klauspost/compress is not compiled into
# the binary at all. A Dependabot bump to the next migrate release is the
# moment to re-scan and drop whichever have gone.
vulnerabilities:
  - id: CVE-2026-56854
    paths: ["usr/local/bin/migrate"]
    statement: "golang.org/x/crypto/ssh authentication bypass. migrate opens no ssh connection here. Fixed in x/crypto 0.55.0; not in any migrate release yet."
    expired_at: 2026-12-10
  - id: CVE-2026-56852
    paths: ["usr/local/bin/migrate"]
    statement: "golang.org/x/text denial of service on invalid UTF-8 in the normaliser. Not on the migrate up code path. Fixed in x/text 0.39.0; not in any migrate release yet."
    expired_at: 2026-12-10
  - id: CVE-2026-56851
    paths: ["usr/local/bin/migrate"]
    statement: "golang.org/x/text/secure/precis: the Nickname profile can panic on crafted input. migrate up against PostgreSQL uses lib/pq, which does not import precis; the pgx drivers in the binary call only the OpaqueString profile. Fixed in x/text 0.41.0; not in any migrate release yet."
    expired_at: 2026-12-10
  - id: CVE-2026-84304
    paths: ["usr/local/bin/migrate"]
    statement: "gRPC-Go server-side issue. migrate runs no gRPC server. Fixed in grpc 1.83.1; not in any migrate release yet."
    expired_at: 2026-12-10
  - id: CVE-2026-84445
    paths: ["usr/local/bin/migrate"]
    statement: "gRPC-Go xDS server crash. migrate runs no xDS server. Fixed in grpc 1.82.2; not in any migrate release yet."
    expired_at: 2026-12-10
  - id: GHSA-hrxh-6v49-42gf
    paths: ["usr/local/bin/migrate"]
    statement: "gRPC-Go xDS RBAC and HTTP/2 issues. migrate runs no xDS server. Fixed in grpc 1.82.1; not in any migrate release yet."
    expired_at: 2026-12-10
  - id: CVE-2026-78669
    paths: ["usr/local/bin/migrate"]
    statement: "golang.org/x/net/http2: excessive CPU from a malicious HTTP/2 peer sending many small SETTINGS frames. migrate up reads migrations from a local path and talks to PostgreSQL over its own protocol, so it opens no HTTP/2 connection. Fixed in x/net 0.60.0; not in any migrate release yet. The Go standard-library half of this finding is fixed by the toolchain rebuild."
    expired_at: 2027-01-12
  - id: CVE-2026-63209
    paths: ["usr/local/bin/migrate"]
    statement: "klauspost/compress s2.NewDict out-of-bounds read. The s2 package is not compiled into migrate: the binary links only the root, fse, huff0, snapref and zstd packages of compress v1.16.7 (checked with go list -deps on the v4.20.1 source with the image build tags, and by searching the image binary for s2 symbols: none). govulncheck in source mode lists the module as required but never called. Fixed in compress 1.18.7; not in any migrate release yet."
    expired_at: 2027-01-12
