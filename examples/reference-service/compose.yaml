services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: app
    ports:
      # Published so `just psql` and any local tool can reach it. The
      # application inside compose does NOT use this — it connects over the
      # compose network to the host name `postgres`.
      - "5432:5432"
    healthcheck:
      # `migrate` and `app` both wait on this. Without it they start while
      # PostgreSQL is still initialising and fail on connection refused.
      # pg_isready is the server's own readiness tool and needs no client.
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mounted over the directory the image COPYs in, so migrations edited on
      # the host apply without rebuilding, and `just migrate-new` writes its new
      # files back out to the host. Production runs the image as built, with no
      # mount — see Dockerfile.migrations.
      - ./migrations:/migrations
    # The single definition of the local database URL. Every `just migrate-*`
    # recipe passes only a subcommand and inherits these flags.
    #
    # `?sslmode=disable` belongs HERE and not in APP_DATABASE__DSN: it is a
    # libpq parameter, golang-migrate requires it against a local server with
    # no TLS, and asyncpg rejects it. engine.py fails loudly if it ever appears
    # in the application's own URL.
    entrypoint:
      - migrate
      - -path=/migrations
      - -database
      - postgres://app:secret@postgres:5432/app?sslmode=disable
    command: ["up"]

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      # Not just "started": the API must not serve a request against a schema
      # that is not there yet. service_completed_successfully waits for the
      # one-shot migrate container to exit 0, so `just up` is a single command
      # that yields a migrated database and a working API.
      migrate:
        condition: service_completed_successfully
      # `payment-stub` has no `profiles:` entry, so plain `docker compose up`
      # already starts it alongside `app` — but starting is not readiness,
      # and without this, `app` could come up and serve its first order
      # before WireMock has finished booting, with no readiness check to
      # catch it (container.py deliberately registers none for the payment
      # provider — see its comment). service_healthy waits for the
      # healthcheck below instead.
      payment-stub:
        condition: service_healthy
    environment:
      APP_ENVIRONMENT: production
      APP_LOG__LEVEL: info
      # Host `postgres` is the compose service name. No driver suffix and no
      # sslmode — see settings.py's DatabaseSettings.dsn.
      APP_DATABASE__DSN: postgresql://app:secret@postgres:5432/app
      # Defaulted rather than hardcoded so one compose file serves both
      # `just up` (telemetry off) and `just o11y` (telemetry on), which
      # sets these two in its own environment.
      APP_OTEL__ENABLED: ${APP_OTEL__ENABLED:-false}
      APP_OTEL__LOGS_ENABLED: ${APP_OTEL__LOGS_ENABLED:-false}
      # `lgtm` is the compose service name below. Harmless when telemetry
      # is off — settings only require an endpoint when enabled.
      APP_OTEL__ENDPOINT: http://lgtm:4317
      # 60s is the SDK default and far too slow to iterate against: you
      # make a request and wait a minute to see the panel move.
      APP_OTEL__METRIC_EXPORT_INTERVAL_MS: 10000
      # `payment-stub` is the compose service name below. WireMock, not a
      # real provider — see ops/payment-stub/mappings and Task 15's
      # documentation of what that does and does not prove.
      APP_PAYMENT__BASE_URL: http://payment-stub:8080
    # The Dockerfile's CMD passes uvicorn --timeout-graceful-shutdown 30,
    # letting in-flight requests drain for up to 30s on SIGTERM. Compose's
    # (and Docker's) own default kill deadline is 10s, so without raising
    # it here the container is SIGKILLed at 10s regardless — a promise
    # uvicorn cannot keep. Set comfortably above the app's own deadline so
    # the app's timeout is always the one that governs shutdown.
    stop_grace_period: 40s
    # No healthcheck: block here. The image already declares one (see the
    # Dockerfile's HEALTHCHECK), and it reads APP_HTTP_PORT the same way
    # the CMD does. A hardcoded port here would drift from that the moment
    # APP_HTTP_PORT is overridden — Compose applies the image's own
    # healthcheck automatically, so duplicating it just to hardcode the
    # port both drifts and repeats the same instruction twice.

  # A local stub of the payment provider, not the provider itself — there
  # is no real one to build a reference service against. WireMock serves
  # the mappings in ops/payment-stub/mappings as-is: two declarative JSON
  # files rather than a second application to build and maintain. Used by
  # `app` above (APP_PAYMENT__BASE_URL) and by `just test-record` to
  # (re-)record the cassettes tests/recorded replays offline. See Task 15
  # for what a stub recorded once and committed does and does not prove.
  payment-stub:
    image: wiremock/wiremock:3.13.2
    ports:
      # Published so `just test-record` can reach it from the host, where
      # pytest runs. The app inside compose reaches it over the compose
      # network at the service name, same as postgres above.
      - "9099:8080"
    volumes:
      - ./ops/payment-stub/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The whole local observability stack in one container: Grafana,
  # Prometheus, Tempo, Loki and an OpenTelemetry collector. One image
  # rather than five services, with OUR dashboards and rules mounted in —
  # the same portable JSON that loads into a production Grafana.
  #
  # Behind a profile, so `just up` stays a database and an API. This image
  # is around 2.5GB and runs six processes; nobody wants it started by
  # default on a laptop.
  #
  # Deliberately NO `depends_on` from `app` to here. Compose would either
  # refuse to start app without this profile active, or auto-enable the
  # profile and pull the whole image for a plain `just up` — both worse
  # than the alternative, which costs nothing: the OTLP exporters batch
  # and retry, so an app that starts first loses a few seconds of
  # telemetry rather than failing.
  lgtm:
    profiles: ["o11y"]
    image: grafana/otel-lgtm:0.32.1
    ports:
      # The image does declare EXPOSE for these, but EXPOSE only documents
      # a port — it does not publish one. Every port that must be reachable
      # from the host has to be listed here.
      - "3000:3000"  # Grafana
      - "4317:4317"  # OTLP over gRPC — what the app exports to
      - "4318:4318"  # OTLP over HTTP
      # Prometheus. Published so `just o11y` can be queried ad hoc while
      # developing a dashboard, and so the integration test can read
      # /api/v1/rules from the host.
      - "9090:9090"
    volumes:
      # Replaces the image's own Prometheus config. Its copy has no
      # rule_files key at all, and there is no other way to load rules —
      # no scrape config to attach to, no directory it already watches.
      - ./ops/prometheus/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      # ONLY the rules directory. ops/prometheus/slo_test.yml deliberately
      # sits outside it: the rule_files glob would pick a promtool test
      # file up as a rules file and Prometheus would refuse to start.
      - ./ops/prometheus/rules:/otel-lgtm/rules:ro
      # Added ALONGSIDE the image's own dashboard provider file rather
      # than over it, so the bundled RED and JVM dashboards survive.
      - ./ops/grafana/provisioning/dashboards/pyfr-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pyfr-dashboards.yaml:ro
      - ./ops/grafana/dashboards:/otel-lgtm/pyfr-dashboards:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
