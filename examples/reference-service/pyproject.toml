[project]
name = "reference-service"
version = "0.1.0"
description = "PyFr reference service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "orjson>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_service"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # starlette.testclient still imports httpx directly; nothing in our
    # control until Starlette itself moves. Narrow and specific on
    # purpose — a blanket `ignore::DeprecationWarning` would hide the next
    # one instead of surfacing it. Note the category: StarletteDeprecationWarning
    # subclasses UserWarning, not the builtin DeprecationWarning.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

# Strict where the business logic lives. Lenient in infrastructure and api,
# where third-party type stubs are imperfect and strictness only produces
# `# type: ignore` comments rather than safety.
[[tool.mypy.overrides]]
module = ["reference_service.domain.*", "reference_service.services.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true
