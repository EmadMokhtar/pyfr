line-length = 88
target-version = "py313"
src = ["src", "tests"]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "S",        # bandit security
    "UP",       # pyupgrade
    "ASYNC",    # flake8-async
    "RUF",      # ruff-specific
]

# SLF001 (flake8-self: private member access) is not in `select` above —
# this codebase's own tests routinely reach into `_gating` /
# `_informational` on ReadinessRegistry (there is no public accessor, by
# design) and enabling the whole rule would flag that established pattern
# everywhere it is used. Declaring it "external" here keeps RUF100 from
# calling the one `# noqa: SLF001` in container.py (the composition root
# reaching into S3ReceiptStore._client for the storage readiness check)
# an unused directive, while leaving the rule itself off.
external = ["SLF001"]

[lint.per-file-ignores]
"tests/*" = ["S101", "B017"]  # assert is how tests assert; B017 is deliberately broad exception
# Throwaway Testcontainers credentials. The container lives for one test
# session, is reachable from nothing outside it, and is destroyed afterwards.
# Scoped to this directory rather than all of tests/ so a real credential
# appearing anywhere else is still caught.
"tests/integration/*" = ["S101", "B017", "S105"]
# S603/S607: the whole point of this script is to shell out to `docker`,
# resolved via PATH rather than an absolute path so it works on any
# contributor's machine; the argument list is a fixed literal, not
# untrusted input.
"scripts/*" = ["S603", "S607"]

[lint.isort]
known-first-party = ["reference_service", "scripts"]
