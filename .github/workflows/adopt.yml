# After a Dependabot pull request merges, copy its pin changes from the
# rendered example into the template (M7 spec, M7-10). The pull request's
# `golden` job already ran `just adopt` and proved the result renders back
# clean, so this commit is that proven result, not a new experiment.
# A github-actions bump goes the other way -- the root's workflows to the
# template's -- and regenerates the example, so the example is staged too.
#
# The push uses the same token release.yml pushes with -- RELEASE_TOKEN,
# the admin's fine-grained token that the `main` ruleset exempts, falling
# back to the workflow token where the secret is absent (see release.yml's
# checkout step and docs/contributing.md, "One-time repository settings").
# A push made with RELEASE_TOKEN starts ci.yml and docs.yml on the adopted
# commit, which is what a template change deserves.
name: Adopt Dependabot pins

on:
  push:
    branches: [main]

permissions:
  contents: write

# One adoption at a time. Two Dependabot merges in quick succession start
# two runs, and the loser would push onto a `main` that has moved. Not
# cancelling: a cancelled run leaves its pins unadopted, and `main` red on
# `golden` until someone runs `just adopt` by hand.
concurrency:
  group: adopt-main
  cancel-in-progress: false

jobs:
  adopt:
    if: github.event.head_commit.author.name == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No credential is left in the checkout for `uv sync` and `just
          # adopt` to read; the push step below gets the token through its
          # own environment (see release.yml's checkout step for why).
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the toolchain
        run: uv sync --group dev

      - name: Adopt into the template
        run: just adopt

      - name: Commit and push the template change
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- '{{cookiecutter.project_slug}}' examples/reference-service; then
            echo "Nothing to adopt: the template already matches."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '{{cookiecutter.project_slug}}' examples/reference-service
          git commit -m "build(deps): adopt dependabot's pins into the template"
          # `main` may have moved since the checkout (a merge landed while
          # `just adopt` ran). Rebase this one commit onto it rather than
          # fail the push and leave `main` red on `golden`. The commit
          # touches pin lines only, which a concurrent merge rarely edits;
          # if one did, the rebase conflicts and this step fails, and the
          # recovery is `just adopt` by hand (docs/contributing.md,
          # "Dependabot and the template").
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git pull --rebase "$remote" main
          git push "$remote" HEAD:main
