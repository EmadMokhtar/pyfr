name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per pull request at a time. Every push starts a paid review;
# without this, the review of the previous push keeps running beside the
# new one, and both can post the same inline comment. A cancelled review
# only loses comments on code that has already been replaced.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Two kinds of pull request cannot read ANTHROPIC_API_KEY, so the job
    # would fail on every one of them:
    #   - Dependabot's: a run Dependabot starts gets the Dependabot
    #     secrets only, and the key is an Actions secret.
    #   - A fork's: GitHub gives `pull_request` runs from a fork no secrets.
    # Skipping them keeps a red check off up to six Dependabot pull
    # requests every Monday.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The default is six hours. A review that has not finished in 30
    # minutes is stuck, and it is billed for every minute it runs.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action exchanges this OIDC token for its GitHub App token.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
