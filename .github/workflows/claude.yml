name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# No `concurrency` group, unlike claude-code-review.yml: every `@claude`
# mention is a separate request, and cancelling one run for the next
# would drop the earlier request without a word.

jobs:
  claude:
    # The action checks that whoever wrote the `@claude` has write access
    # to the repository, and stops if they do not. So on this public
    # repository an `@claude` from anyone else changes nothing.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # The default is six hours. A request can make changes and push them,
    # so it gets longer than a review, but a run still going after an hour
    # is stuck, and it is billed for every minute it runs.
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # The action exchanges this OIDC token for its GitHub App token.
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Lets Claude read CI results on pull requests.
          additional_permissions: |
            actions: read

          # Options: https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
