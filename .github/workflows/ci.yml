name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` are not default trigger types, but the
    # docs-freshness job's `no-docs-needed` escape hatch is worthless without
    # them: with no rerun, adding the label leaves the already-failed check
    # red.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# One run per branch. Cancelling in-flight runs is safe here in a way it
# is not for release.yml or docs.yml: nothing is published, so a cancelled
# run leaves nothing half-done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `just check` is lint, typecheck, imports, unit tests and pre-commit,
    # then `git diff --exit-code` to catch a hook that mutated the tree.
    # One job rather than five: they share an install, they all finish in
    # a couple of minutes, and splitting them would mean five copies of
    # the setup for a failure message that already names which gate broke.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v4
        with:
          # `just precommit` runs pre-commit over `git ls-files`, and the
          # commitizen hook checks commit messages in the range -- both
          # need real history, not a shallow clone.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install the project
        run: uv sync

      - name: Run every fast gate
        run: just check

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the documentation toolchain
        run: uv sync --group docs

      - name: Build the docs site
        # --strict turns a dead reference or an unresolvable include into a
        # failure rather than a warning nobody reads.
        run: uv run mkdocs build --strict

  docs-freshness:
    # Blunt backstop for stale prose. The `no-docs-needed` label is the escape
    # hatch for refactors and internal-only changes; a label is used rather
    # than a commit trailer because pull requests are squash-merged, which
    # rewrites the message.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git diff base...head` needs both sides of the history.
          fetch-depth: 0

      - name: Check that documentation was updated
        env:
          # Passed via env rather than interpolated into the script body, so
          # nothing from the event payload can be read as shell.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # No dependencies: the script is stdlib-only, so this needs no uv sync.
        run: python3 scripts/check_docs_updated.py "$BASE_SHA" HEAD
