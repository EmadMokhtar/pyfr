name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`/`unlabeled` are not default trigger types, but the
    # docs-freshness job's `no-docs-needed` escape hatch is worthless without
    # them: with no rerun, adding the label leaves the already-failed check
    # red.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Every job reads the repository and nothing else; a job that needs more
# declares it itself.
permissions:
  contents: read

# One run per branch. Cancelling in-flight runs is safe here in a way it
# is not for release.yml or docs.yml: nothing is published, so a cancelled
# run leaves nothing half-done.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `just check` is lint, typecheck, imports, unit tests and pre-commit,
    # then `git diff --exit-code` to catch a hook that mutated the tree.
    # One job rather than five: they share an install, they all finish in
    # a couple of minutes, and splitting them would mean five copies of
    # the setup for a failure message that already names which gate broke.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the project
        run: uv sync

      - name: Run every fast gate
        run: just check

  golden:
    # The template is the source of truth and examples/reference-service/ is
    # rendered from it (M7 spec, M7-1). This job fails when the two disagree,
    # with the list of files and a diff of the first -- see
    # docs/contributing.md, "Working on the template".
    #
    # Dependabot edits the rendered example, not the template: it cannot
    # parse Jinja. On its pull requests -- and on the push that merges one --
    # adopt its pin changes into the template first (M7-10). adopt.yml then
    # commits the same result to main.
    #
    # The same step carries the root workflows' action pins into the
    # template's workflows: Dependabot's github-actions ecosystem reads
    # /.github/workflows only, so a `ci(deps)` bump lands here and the
    # template follows it (scripts/regen.py, adopt_action_pins).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the toolchain
        run: uv sync --group dev

      - name: Adopt Dependabot's pins into the template
        # The pull request's author, not `github.actor`: the actor is
        # whoever triggered the run, and changes to the maintainer when
        # one pushes a fix to a Dependabot branch -- which would skip the
        # adoption and fail the render on Dependabot's own pin change.
        # The second clause is the push event that merges the pull
        # request.
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.head_commit.author.name == 'dependabot[bot]'
        run: just adopt

      - name: Render and compare
        run: just regen-check

  precommit:
    # The repository's own hooks over every tracked file, from the root
    # configuration. The `check` job's `just check` inside the example runs
    # the example's precommit recipe, which skips itself when nested; this
    # is the job that covers that tree, and the root's own files.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the toolchain
        # ruff runs from the root's environment; `uv lock --check --project`
        # needs no environment; the remote hooks bring their own.
        run: uv sync --group dev

      - name: Run every hook
        run: just precommit

  integration:
    # testcontainers starts PostgreSQL, Redis and MinIO itself. Deliberately
    # NOT a `services:` block: the containers are pinned in the test code,
    # so the versions CI runs against are the versions a developer runs
    # against, and there is one place to change them.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync
      - run: just test-integration

  gates:
    # Migration files, the schema snapshot, model/schema drift, and the
    # generated configuration reference. Needs Docker for the schema
    # gates, which run against a real PostgreSQL.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync
      - run: just gates

  contract:
    # `just contract-gates`: schemathesis conformance against the committed
    # contract, plus the oasdiff breaking-change check cross-referenced
    # against the commit's own `!` marker. OpenAPI drift -- whether the
    # committed openapi.json still matches the code -- is NOT one of them:
    # that gate (tests/unit/test_contract_drift.py) carries no contract
    # marker, so it runs in the default `just test` tier instead, covered
    # by the `check` job above. `fetch-depth: 0` because the commit-marker
    # half reads the commit range -- with a shallow clone `git log
    # base..head` is empty, which reads as "nobody marked it breaking" and
    # fails every legitimate breaking change.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - run: uv sync
      - run: just contract-gates

  o11y-gates:
    # promtool over the SLO rules, out of the pinned otel-lgtm image. No
    # uv sync: it runs no Python at all.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just o11y-gates

  docs:
    # `just check` at the repository root: the documentation site build
    # (`docs-build`, --strict), the root project's own test suite (`test`)
    # -- the hooks' tests and the generation tests that render the
    # template -- and the golden diff
    # (`regen-check`), which the `golden` job above also runs on its own
    # so a mismatch is named by a job of its own. Job id kept as `docs`
    # rather than renamed: the documentation build is still most of what
    # this job does, and renaming a job id changes what GitHub calls a
    # required status check, which this repository cannot see or verify
    # from here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the documentation toolchain
        run: uv sync --group docs

      - name: Adopt Dependabot's pins into the template
        # Same step, same condition as the `golden` job's: `just check`
        # below runs the golden diff and tests/test_regen.py's check that
        # the template's action pins match the root's, and on a Dependabot
        # pull request neither holds until the pins are adopted.
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.head_commit.author.name == 'dependabot[bot]'
        run: just adopt

      - name: Run every root-level gate
        run: just check

  docs-freshness:
    # Blunt backstop for stale prose. The `no-docs-needed` label is the escape
    # hatch for refactors and internal-only changes; a label is used rather
    # than a commit trailer because pull requests are squash-merged, which
    # rewrites the message.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'no-docs-needed')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `git diff base...head` needs both sides of the history.
          fetch-depth: 0

      - name: Check that documentation was updated
        env:
          # Passed via env rather than interpolated into the script body, so
          # nothing from the event payload can be read as shell.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # The script is the reference service's rendered copy (the template
        # owns it); the options name PyFr's own trees: a change under the
        # template body's src/ must touch the root docs, the template's
        # docs or README, the root README or mkdocs.yml.
        run: >-
          python3 examples/reference-service/scripts/check_docs_updated.py
          --source '{{cookiecutter.project_slug}}/src/'
          --docs docs/ --docs README.md --docs mkdocs.yml
          --docs '{{cookiecutter.project_slug}}/docs/'
          --docs '{{cookiecutter.project_slug}}/README.md'
          --exclude-docs docs/superpowers/
          "$BASE_SHA" HEAD

  docs-warnings:
    # Advisory only -- review dates and path coupling. Never fails; see
    # docs/contributing.md for what has to be true before it does.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `just docs-freshness` diffs base...head, which needs real history.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the documentation toolchain
        # `examples/reference-service/scripts/check_docs_freshness.py` does
        # `import yaml` directly. PyYAML is declared as a direct `dev`
        # dependency (pyproject.toml) precisely so that does not depend on
        # MkDocs happening to pull it in transitively; `uv sync` installs
        # the default `dev` group alongside whichever `--group` is named
        # explicitly.
        run: uv sync --group docs

      - name: Report documentation freshness
        env:
          # Passed via env rather than interpolated into the script body, so
          # nothing from the event payload can be read as shell.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Calls the same `just docs-freshness` recipe a developer runs
        # locally, rather than invoking
        # examples/reference-service/scripts/check_docs_freshness.py
        # directly -- see the Global Constraint on `just` as the one
        # definition of a gate.
        run: just docs-freshness "$BASE_SHA" HEAD

  links:
    # External links only; internal ones are `mkdocs build --strict`'s job
    # in the `docs` job above. Separate from that job because this one
    # depends on the internet being well, and a network blip should not
    # read as a broken site.
    #
    # Deliberately NOT `just links`, unlike every other gate in this file.
    # This is a recorded exemption, not an oversight: the
    # `lycheeverse/lychee-action@v2` action supplies the `lychee` binary
    # itself, which this runner does not otherwise have -- installing it
    # some other way just to shell out to `just links` would add a step
    # for no benefit. `lychee.toml` still stays the single definition of
    # the check's behaviour either way, since the action is pointed at the
    # same config file and the same paths that recipe uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          # The template body's Markdown carries Jinja inside its URLs, so
          # the rendered example -- examples/reference-service/ -- is what
          # gets checked instead.
          args: --config lychee.toml --no-progress 'docs/**/*.md' README.md 'examples/reference-service/docs/**/*.md' examples/reference-service/README.md
          fail: true

  docs-examples:
    # The documented `curl` examples, against a real running stack.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just docs-examples

  build:
    # Both images for linux/amd64 AND linux/arm64, with no output: proves
    # the Dockerfiles still build for both, which is what "Apple Silicon
    # laptops and cloud servers share one image" (spec 12) rests on. QEMU
    # supplies the emulated architecture; the `pyfr` builder is created by
    # the recipe itself (`_buildx-builder`) and is never made the current
    # builder, so plain `docker build` elsewhere in the same job still
    # loads into the daemon. No `docker/setup-buildx-action`: it makes its
    # own `docker-container` builder the CURRENT one, and on Docker >= 23
    # `docker build` then runs on that builder and `--load`s nothing (the
    # default `docker` driver cannot target two platforms at once -- M6
    # plan, Verified Fact 2). `docker buildx` itself is preinstalled on
    # ubuntu-latest. Pushing is release.yml's job.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: extractions/setup-just@v4
      - name: Build both images for both architectures
        run: just build-multiarch

  security:
    # Spec 10.4's `security` row: pip-audit, Trivy, SBOM. Four recipes as
    # four steps, so a red job names which one. `build-images` first
    # because `scan` and `sbom` read the locally built single-architecture
    # images over the Docker socket. No `uv sync`: `just audit` reads the
    # lock with `uv export` and runs pip-audit through `uvx`.
    #
    # This job's result can change with no commit -- an advisory is
    # published against a version already locked -- which is also why
    # nightly.yml runs the same recipes every night.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/reference-service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Build both images
        run: just build-images
      - name: Audit the reference service's lock
        run: just audit
      - name: Audit the documentation toolchain's lock
        working-directory: .
        run: just audit
      - name: Scan both images
        run: just scan
      - name: Write the software bills of materials
        run: just sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: examples/reference-service/sbom/*.cdx.json
          if-no-files-found: error
