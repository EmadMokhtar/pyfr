name: Docs

# Requires a one-time manual setting: Settings -> Pages -> Source =
# "GitHub Actions". Until that is set, `deploy` fails with an opaque error
# even though `build` succeeds, and every published documentation link stays
# dead. See docs/contributing.md, "One-time repository settings".
#
# The deploy carries two sites: PyFr's, and the reference service's own
# documentation under `reference-service/` -- the site every generated
# project ships, rendered from the template (spec §9.2).

on:
  push:
    branches: [main]
  # Allows a redeploy without a code change.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight -- a cancelled deploy
# can leave Pages serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install the documentation toolchain
        run: uv sync --group docs

      - name: Build both sites
        # `just docs-build` builds PyFr's site into site/ and the reference
        # service's rendered site into site/reference-service/ -- one
        # definition of the build, the same one a contributor runs.
        run: just docs-build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
