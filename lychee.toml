# External link checking. Internal references are already covered by
# `mkdocs build --strict`, which fails on a dead cross-reference; this
# catches the other half -- links to things outside the repository, which
# rot without anyone here touching a file.

# Retry rather than fail on a slow or momentarily unhappy host. A link
# checker that reports false failures gets switched off within a month.
max_retries = 3
retry_wait_time = 2
timeout = 20

# Politeness, and self-preservation: too many parallel requests to one
# host is what earns a 429 in the first place.
max_concurrency = 8

# Some hosts refuse a request with no user agent, or with one they read as
# a scraper.
user_agent = "Mozilla/5.0 (compatible; lychee; +https://github.com/EmadMokhtar/pyfr)"

# 429 is rate limiting, not a dead link. Accepting it here is the
# difference between a check that means something and one people ignore.
accept = ["200..=299", "429"]

exclude = [
    # Examples telling a reader to open their own machine. Correct as
    # instructions, unreachable from a CI runner.
    "^https?://localhost",
    "^https?://127\\.0\\.0\\.1",
    "^https?://0\\.0\\.0\\.0",
    # Compose service names, which resolve only inside the compose network.
    "^https?://(minio|postgres|redis|payment-stub|otel-lgtm):",
    # MkDocs Material's own edit links point at paths on a branch, which
    # 404 for a page added in the same commit being checked.
    "^https://github\\.com/EmadMokhtar/pyfr/edit/",
    # The ADRs' "full reasoning" links point at plans and specs on `main`,
    # which 404 for a page added in the same branch being checked;
    # docs/superpowers is excluded from the site, so this is the only way
    # to reach it.
    "^https://github\\.com/EmadMokhtar/pyfr/blob/main/docs/superpowers/",
    # Placeholder hosts in configuration examples. Anchored to match only the host
    # and its subdomains, not as a substring in unrelated domains.
    "^https?://([a-z0-9-]+\\.)*example\\.com(?::\\d+)?(/|$)",
    # PyFr's own site, deployed by the same workflow that builds it: a link
    # to a page added in this branch resolves only after the deploy.
    # `mkdocs build --strict` proves every page and anchor within one site,
    # and scripts/check_site_links.py (run by `just docs-build`) resolves the
    # absolute links between the two sites against the built site/ tree.
    "^https://emadmokhtar\\.github\\.io/pyfr/",
    # A workflow's status badge exists only once that workflow has run on
    # the default branch, so the badge of a workflow added in the branch
    # being checked is 404 until the merge. A wrong badge shows as a broken
    # image at the top of the README, which nobody misses.
    "^https://github\\.com/EmadMokhtar/pyfr/actions/workflows/[^/]+/badge\\.svg$",
]

# Checked as text, not as a rendered site: the source is the thing under
# review, and site/ is a build artifact that may not exist.
exclude_path = [
    "site",
    ".venv",
    "examples/reference-service/.venv",
    "docs/superpowers",
    "docs/adr/template.md",  # A skeleton to copy, not a page to read; placeholder link is intentionally unresolvable. Already excluded from mkdocs.yml.
    # The template body's Markdown carries Jinja inside its URLs, so the
    # rendered example is what gets checked instead; without this,
    # nightly.yml's '**/*.md' sweep would also catch the template body's.
    # Every entry here is a regular expression, hence the escapes: `{{` is
    # otherwise an invalid repetition operator and lychee refuses to start.
    "\\{\\{cookiecutter\\.project_slug\\}\\}",
]
